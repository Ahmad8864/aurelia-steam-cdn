[package]
name = "aurelia-steam-cdn"
version = "4.1.0"
edition = "2024"
description = "Steam CDN client (Aurelia fork of steam-cdn, built on aurelia-steam-vent 0.8)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/aurelia-steam-cdn"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "macros"] }
futures = "0.3"
steam-vent = { package = "aurelia-steam-vent", version = "0.8.0" }
steam-vent-proto = { package = "aurelia-steam-vent-proto", version = "0.6.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyvalues-parser = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
thiserror = "2.0"
tracing = "0.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] } # Deflate only: Steam zips nothing else.
itertools = "0.15"
crc32fast = "1.4"
bytes = "1.9"
base64 = "0.23"
protobuf = "3.7.2"
aes = "0.9"
cbc = "0.2"
sha1 = "0.11"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
ruzstd = "0.9.1" # Decodes Steam's VSZ chunk containers.
